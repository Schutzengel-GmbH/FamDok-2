<div class="user-admin-page">
  <section class="page-header">
    <div class="page-header__content">
      <div class="page-header__top">
        <div>
          <span class="page-kicker">Verwaltung</span>
          <h1>Benutzer</h1>
          <p>{{ filteredUsers().length }} von {{ users().length }} Benutzern</p>
        </div>

        @if (!creating()) {
          <button
            class="btn btn-primary"
            type="button"
            (click)="creating.set(true)">
            <i class="bi bi-person-plus"></i>
            Neuer Benutzer
          </button>
        }
      </div>

      <div class="search-field">
        <span class="search-field__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              d="M21 21l-4.35-4.35"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2" />
            <circle
              cx="11"
              cy="11"
              r="6"
              fill="none"
              stroke="currentColor"
              stroke-width="2" />
          </svg>
        </span>

        <input
          id="filter"
          type="text"
          [(ngModel)]="filter"
          placeholder="Nach Name, E-Mail, Rolle oder Organisation suchen"
          aria-label="Benutzer filtern" />
      </div>
    </div>
  </section>

  @if (creating()) {
    <app-user-create
      [orgs]="orgs"
      (created)="onCreated($event)"
      (closed)="creating.set(false)" />
  }

  <div class="user-list">
    @for (user of filteredUsers(); track user.id) {
      <app-user-item
        [orgs]="orgs"
        [user]="user"
        [withOrg]="(user$ | async)?.role === 'Admin'" />
    } @empty {
      <div class="empty-state">
        <h3>Keine Benutzer gefunden</h3>
        <p>Für diesen Filter gibt es keine Treffer.</p>
      </div>
    }
  </div>
</div>
