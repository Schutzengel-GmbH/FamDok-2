@if (tempPassword(); as tp) {
  <app-temp-password
    class="user-create__temp-password"
    [email]="tp.email"
    [password]="tp.password"
    (dismiss)="tempPassword.set(undefined)" />
}

<form class="user-create" [formGroup]="form" (ngSubmit)="submit()">
  <h2>Neuer Benutzer</h2>

  <div class="user-create__fields">
    <div class="form-floating">
      <input
        class="form-control"
        id="newEmail"
        type="email"
        autocomplete="off"
        formControlName="email" />
      <label for="newEmail">E-Mail</label>
    </div>
    <div class="form-floating">
      <input
        class="form-control"
        id="newFirstName"
        type="text"
        formControlName="firstName" />
      <label for="newFirstName">Vorname</label>
    </div>
    <div class="form-floating">
      <input
        class="form-control"
        id="newLastName"
        type="text"
        formControlName="lastName" />
      <label for="newLastName">Nachname</label>
    </div>
    <div class="form-floating">
      <select class="form-select" id="newRole" formControlName="role">
        @for (role of roles; track role) {
          <option [value]="role">{{ role }}</option>
        }
      </select>
      <label for="newRole">Rolle</label>
    </div>
    <div class="form-floating">
      <select class="form-select" id="newJobTitle" formControlName="jobTitle">
        <option [ngValue]="null">Keine</option>
        @for (jobTitle of jobTitles; track $index) {
          <option [value]="jobTitle">{{ jobTitle }}</option>
        }
      </select>
      <label for="newJobTitle">Fachrichtung</label>
    </div>
    <div class="form-floating">
      <select
        class="form-select"
        id="newOrganisationId"
        formControlName="organisationId">
        <option [ngValue]="null">Keine Organisation</option>
        @for (org of orgs(); track org.id) {
          <option [value]="org.id">{{ org.name }}</option>
        }
      </select>
      <label for="newOrganisationId">Organisation</label>
    </div>
    <div class="user-create__suborgs">
      <label class="form-label" for="newSubOrgSelect">
        Unterorganisationen
      </label>
      <app-multi-select
        id="newSubOrgSelect"
        [items]="availableSubOrgs()"
        [value]="selectedSubOrgs()"
        [compareFn]="subOrgCompareFn"
        labelProp="name"
        placeholder="Keine"
        (selectChange)="onSubOrgsChange($event)" />
    </div>
  </div>

  <fieldset class="user-create__onboarding">
    <legend>Erstes Passwort</legend>
    <label class="user-create__radio">
      <input type="radio" value="invite" formControlName="onboarding" />
      Einladung per E-Mail – der Benutzer setzt sein Passwort selbst
    </label>
    <label class="user-create__radio">
      <input type="radio" value="tempPassword" formControlName="onboarding" />
      Temporäres Passwort – wird einmalig angezeigt und muss beim ersten
      Login geändert werden
    </label>
  </fieldset>

  <div class="user-create__footer">
    @if (form.controls.organisationId.invalid || form.controls.subOrganisationIds.invalid) {
      <span class="badge-soft badge-soft--red">Organisation erforderlich</span>
    }
    <div class="user-create__footer-actions">
      <button
        class="btn btn-outline-secondary btn-sm"
        type="button"
        (click)="closed.emit()">
        Schließen
      </button>
      <button
        class="btn btn-primary btn-sm"
        type="submit"
        [disabled]="form.invalid || saving()">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        }
        Anlegen
      </button>
    </div>
  </div>
</form>
