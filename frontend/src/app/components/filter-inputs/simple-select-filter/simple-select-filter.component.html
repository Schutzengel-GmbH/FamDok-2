<div class="card p-2">
  <p>{{ name() }}</p>
  <div class="d-flex gap-1">
    <select class="form-select" [(ngModel)]="filter">
      @for (option of options(); track option.id) {
        <option [ngValue]="option">{{ option.text }}</option>
      }
    </select>
    <button class="btn btn-sm btn-outline-secondary" (click)="resetFilter()">
      <i class="bi bi-x"></i>
    </button>
  </div>
</div>
