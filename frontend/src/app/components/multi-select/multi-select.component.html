<div
  ngbDropdown
  autoClose="outside"
  container="body"
  [class.form-floating]="fieldLabel()"
  (openChange)="onOpenChange($event)">
  <button
    #dropdownButton
    type="button"
    ngbDropdownToggle
    [id]="fieldId"
    [class.btn]="!fieldLabel()"
    [class.btn-outline-secondary]="!fieldLabel()"
    [class.form-select]="fieldLabel()"
    [class.multi-select__field]="fieldLabel()"
    [attr.title]="fieldLabel() ? valueText() || null : null">
    {{ valueText() || placeholder() }}
  </button>
  @if (fieldLabel(); as text) {
    <label [for]="fieldId">{{ text }}</label>
  }
  <div
    ngbDropdownMenu
    aria-labelledby="dropdownButton"
    [style.min-width.px]="menuMinWidth()">
    @for (item of items(); track $index) {
      <button
        type="button"
        (click)="itemClick(item)"
        ngbDropdownItem
        class="dropdown-item multi-select__item"
        [disabled]="
          maximum() !== undefined &&
          value() !== undefined &&
          value()!.length >= maximum()! &&
          !selected(item)
        ">
        <span class="multi-select__check">
          @if (selected(item)) {
            <i class="bi bi-check-lg"></i>
          }
        </span>
        <span>{{ label(item) }}</span>
      </button>
    } @empty {
      <span class="dropdown-item-text text-body-secondary">
        Keine Optionen verfügbar
      </span>
    }
  </div>
</div>
