<ul class="list-group">
  <li
    class="list-group-item d-flex flex-row justify-content-between align-items-center">
    <span>
      Datum: {{ doc().date | date }}
      @if (hasWarning()) {
        <span
          class="badge rounded-pill text-bg-danger ms-1"
          title="Dokumentation ist unvollständig.">
          <i class="bi bi-exclamation-triangle-fill"></i>
        </span>
      }
    </span>
    <div>
      <a
        class="btn btn-outline-secondary"
        [attr.aria-label]="readOnly() ? 'Ansehen' : 'Bearbeiten'"
        [routerLink]="link"
        [queryParams]="readOnly() ? { readonly: true } : undefined">
        <i class="bi" [class.bi-pencil]="!readOnly()" [class.bi-eye]="readOnly()"></i>
      </a>
      <button
        class="m-1 btn btn-outline-secondary"
        aria-label="PDF herunterladen"
        (click)="
          documentationService.downloadContactDocumentationPDF(
            doc().caseId,
            doc().id
          )
        ">
        <i class="bi bi-cloud-download"></i>
      </button>
    </div>
  </li>
  <li class="list-group-item">Zusammenfassung: {{ doc().zusammenfassung }}</li>
</ul>
