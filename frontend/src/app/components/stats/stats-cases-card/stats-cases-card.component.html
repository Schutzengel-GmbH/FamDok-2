<div class="card shadow-sm stats-card">
  <div class="card-header d-flex align-items-center gap-2">
    <i class="bi bi-list-task"></i>
    <strong>Aktuelle Fälle</strong>
  </div>

  <div class="card-body stats-cases-body">
    <ng-container *ngIf="cases?.length; else noCases">
      <div class="stats-case-item" *ngFor="let c of cases">
        <div class="stats-case-title">Fall {{ c.id }}</div>
        <div class="stats-case-subline">
          Aufgenommen: {{ c.startedAt.toLocaleDateString() }}
        </div>
      </div>
    </ng-container>

    <ng-template #noCases>
      <div class="text-muted small">Aktuell keine offenen Fälle vorhanden.</div>
    </ng-template>
  </div>
</div>
