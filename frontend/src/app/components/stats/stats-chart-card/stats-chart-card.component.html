<div class="card shadow-sm stats-card">
  <div class="card-header d-flex align-items-center gap-2">
    <i class="bi bi-graph-up"></i>
    <strong>Statistische Auswertung</strong>

    <div class="ms-auto d-flex gap-2 stats-chart-selects">
      <select
        class="form-select form-select-sm"
        [(ngModel)]="selectedChartKey"
        (change)="update()">
        <option *ngFor="let c of availableCharts" [value]="c.key">
          {{ c.label }}
        </option>
      </select>
    </div>
  </div>

  <div class="card-body">
    <div class="stats-chart-wrapper">
      @switch (selectedChartKey) {
        @case ("artDerBeratung") {
          <app-pie-chart [datasets]="{ data }" [labels]="labels" />
        }
        @case ("ziel") {
          <app-pie-chart [datasets]="{ data }" [labels]="labels" />
        }
        @case ("ort") {
          <app-bar-chart [datasets]="{ data }" [labels]="labels" />
        }
      }
    </div>
  </div>
</div>
