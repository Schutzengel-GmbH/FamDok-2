<div class="d-flex align-items-center gap-2">
  <div class="form-floating flex-grow-1">
    <select
      [id]="ageRangeId"
      class="form-select"
      aria-label="Altersgruppe"
      [(ngModel)]="ageRange">
      <option [ngValue]="0">0-1 Jahre</option>
      <option [ngValue]="1">1-2 Jahre</option>
      <option [ngValue]="2">2-3 Jahre</option>
    </select>
    <label [for]="ageRangeId">Altersgruppe</label>
  </div>
  <button
    type="button"
    class="btn btn-outline-secondary btn-sm"
    title="Diagramm im Vollbild mit Zoom anzeigen"
    (click)="openFullscreen()">
    <i class="bi bi-arrows-fullscreen me-1"></i>
    Vollbild
  </button>
  <button
    type="button"
    class="btn btn-outline-secondary btn-sm"
    title="Diagramm als PNG herunterladen"
    (click)="downloadChart()">
    <i class="bi bi-download me-1"></i>
    PNG exportieren
  </button>
</div>
<canvas baseChart [data]="data()" [options]="options()" type="line"></canvas>
