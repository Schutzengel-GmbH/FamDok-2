<div class="modal-header">
  <h4 class="modal-title">Messung {{ dataPoint ? "bearbeiten" : "hinzufügen" }}</h4>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss('Cross click')"></button>
</div>
<div class="modal-body">
  <form [formGroup]="form">
    <!-- Datum -->
    <div class="form-group mb-2">
      <label for="date">Datum</label>
      <div class="input-group">
        <input
          id="date"
          class="form-control"
          [class.is-invalid]="form.get('date')?.invalid"
          placeholder="Datum"
          formControlName="date"
          navigation="select"
          name="dp"
          (click)="d.toggle()"
          ngbDatepicker
          #d="ngbDatepicker"
          [maxDate]="maxDate"
          required />
        <button
          class="btn btn-outline-secondary bi bi-calendar3"
          (click)="d.toggle()"
          type="button"></button>
        @if (form.get("date")!.invalid) {
          <div class="invalid-feedback">
            @if (form.get("date")?.hasError("required")) {
              Datum erforderlich
            }
          </div>
        }
      </div>
    </div>

    <!-- Gewicht -->
    <div class="form-group mb-2">
      <label for="weightKg">Gewicht (kg)</label>
      <input
        id="weightKg"
        type="number"
        step="0.1"
        class="form-control"
        formControlName="weightKg"
        placeholder="Gewicht in kg" />
    </div>

    <!-- Größe -->
    <div class="form-group mb-2">
      <label for="sizeCm">Größe (cm)</label>
      <input
        id="sizeCm"
        type="number"
        step="0.1"
        class="form-control"
        formControlName="sizeCm"
        placeholder="Größe in cm" />
    </div>

    @if (form.hasError("atLeastOneMeasurement") && form.touched) {
      <div class="text-danger small mb-2">
        Bitte Gewicht oder Größe angeben.
      </div>
    }
  </form>
</div>
<div class="modal-footer">
  <button
    [disabled]="form.invalid"
    type="button"
    class="btn btn-outline-secondary"
    (click)="save()">
    Speichern
  </button>
  <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
    Abbrechen
  </button>
</div>
