@if (form) {
  <div class="modal-header">
    <h4 class="modal-title">
      {{ isEdit ? "Dokument bearbeiten" : "Dokument hochladen" }}
    </h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="activeModal.dismiss('Cross click')"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="form">
      <div class="form-group mb-2">
        <label for="title">Titel</label>
        <input
          id="title"
          type="text"
          class="form-control"
          formControlName="title"
          [class.is-invalid]="form.get('title')?.invalid" />
        @if (form.get("title")!.invalid) {
          <div class="invalid-feedback">Titel erforderlich</div>
        }
      </div>
      <div class="form-group mb-2">
        <label for="description">Beschreibung</label>
        <textarea
          id="description"
          class="form-control"
          formControlName="description"
          rows="3"></textarea>
      </div>
      <div class="form-group mb-2">
        <label>Tags</label>
        <div>
          <app-multi-select
            [items]="allTags"
            labelProp="name"
            [(value)]="selectedTags"
            placeholder="Tags auswählen" />
        </div>
      </div>
      @if (!isEdit) {
        <div class="form-group mb-2">
          <label for="file">Datei</label>
          <input
            id="file"
            type="file"
            class="form-control"
            accept=".pdf,.jpg,.jpeg,.png,.docx"
            (change)="filesChanged($event)" />
        </div>
      }
    </form>
  </div>
  <div class="modal-footer">
    <button
      [disabled]="!canSave"
      type="button"
      class="btn btn-outline-secondary"
      (click)="save()">
      Speichern
    </button>
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
      Abbrechen
    </button>
  </div>
}
