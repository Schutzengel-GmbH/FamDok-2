<app-header></app-header>

<div class="app-shell">
  <app-menu
    id="app-sidebar"
    class="app-sidebar"
    [class.app-sidebar--open]="sidebar.isOpen()"></app-menu>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>

<app-confirm-dialog-container />
<app-toasts />

@if (sidebar.isOpen()) {
  <div class="app-overlay" (click)="sidebar.close()"></div>
}
