version: "3.9"

services:
  frontend:
    build:
      context: ./
      dockerfile: ./frontend/Dockerfile
    environment:
      KC_BASE_URL: ${KC_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      KC_REALM: ${KC_REALM}
      KC_CLIENT: ${KC_CLIENT}
      PRODUCTION: ${PRODUCTION}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}
    ports:
      - 8080:8080
    restart: unless-stopped

  backend:
    build:
      context: ./
      dockerfile: ./backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/${POSTGRES_DB}
      KC_BASE_URL: ${KC_BASE_URL}
      API_BASE_URL: ${API_BASE_URL}
      UPLOAD_DIR: /app/dist/uploads
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      KC_REALM: ${KC_REALM}
      KC_CLIENT: ${KC_CLIENT}
      KC_ADMIN_USER: ${KC_ADMIN_USER}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      PRODUCTION: ${PRODUCTION}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}
    volumes:
      - uploads-data:/app/dist/uploads
    ports:
      - 3000:3000
    restart: unless-stopped
    depends_on:
      - app-db

  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--proxy-headers=xforwarded"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_HOSTNAME_URL: ${KC_BASE_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./shared/keycloak-config:/opt/keycloak/data/import
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    depends_on:
      - keycloak-db

  app-db:
    image: postgres:15
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - app-data:/var/lib/postgresql/data
    expose:
      - 5432

volumes:
  app-data:
  keycloak-data:
  uploads-data:
